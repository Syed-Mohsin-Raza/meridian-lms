spring:
  application:
    name: lms

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:loan_management}
    username: ${POSTGRES_USER:lms_user}
    password: ${POSTGRES_PASSWORD:lms_secret_2026}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway manages schema, Hibernate only validates
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Ensures Flyway bean is created before EntityManagerFactory
  sql:
    init:
      mode: never

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

    cache:
      type: redis
      redis:
        time-to-live: 60000   # 60 seconds default
        cache-null-values: false

  ai:
    openai:
      api-key: ${meridian.ai.api-key}
      chat:
        options:
          model: ${meridian.ai.model}
          temperature: 0.3

server:
  port: 4000

app:
  jwt:
    secret: ${JWT_SECRET:change-me-this-is-a-dev-only-secret-replace-in-production-min-32-chars}
    expiry-ms: ${JWT_EXPIRY_MS:604800000}  # 7 days

  rate-limit:
    enabled: true
    capacity: 5
    window-seconds: 60

logging:
  level:
    root: INFO
    com.meridian.lms: DEBUG
    org.flywaydb: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: lms

meridian:
  ai:
    enabled: ${AI_ENABLED:true}
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
    cache-ttl: 24h

resilience4j:
  retry:
    instances:
      openAiChat:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  circuitbreaker:
    instances:
      openAiChat:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true