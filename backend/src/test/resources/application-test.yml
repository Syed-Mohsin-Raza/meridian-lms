spring:
  datasource:
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  jpa:
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      # Overridden by @DynamicPropertySource in AbstractIntegrationTest
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

app:
  rate-limit:
    enabled: false

meridian:
  ai:
    enabled: false